name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/check.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-card
          path: verified
      - name: Recheck the verified artifact before publishing
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          folder = Path('verified')
          manifest = json.loads((folder / 'build-manifest.json').read_text())
          assert manifest['filename'] == 'spa-monitor-card.js'
          assert os.environ['RELEASE_TAG'] == 'v' + manifest['version']
          assert hashlib.sha256((folder / manifest['filename']).read_bytes()).hexdigest() == manifest['sha256']
          assert (folder / 'release-notes.md').read_text().strip()
          PY
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            verified/spa-monitor-card.js
            verified/build-manifest.json
          body_path: verified/release-notes.md
          fail_on_unmatched_files: true
